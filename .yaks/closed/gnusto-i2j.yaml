id: gnusto-i2j
title: Behaviors as functions with explicit parameters
type: feature
priority: 1
created: '2026-01-11T23:30:57.559834-05:00'
updated: '2026-02-08T19:07:10.973815Z'
description: "## Summary\n\nRedesign behaviors from magic-bound expressions to explicit\
  \ functions with positional parameters. This enables cleaner handling of multi-argument\
  \ verbs like \"give X to Y\".\n\n## Current Design\n\n```scheme\n; Behaviors are\
  \ expressions with magic bindings\n(behaviors\n  (:give\n    (cond\n      ((not\
  \ (held? ?object)) ...)  ; ?object magically bound - but wrong for give!\n```\n\n\
  Dispatch: `(do :verb give :object @hacker :with @food)`\n\nProblem: `?object` binds\
  \ to the dispatch target, not the item being given.\n\n## New Design\n\n```scheme\n\
  ; Behaviors are functions with explicit params\n(behaviors\n  (:give (fn (?item)\n\
  \    ; ?self = @hacker (auto-bound to behavior owner)\n    ; ?actor = @player (auto-bound\
  \ to action performer)\n    ; ?item = positional arg from (do) call\n    (cond\n\
  \      ((not (held-by? ?item ?actor)) ...)\n```\n\nDispatch: `(do @hacker :give\
  \ @food)`\n\n## Auto-bound Symbols\n\n- `?self` - The object whose behavior is being\
  \ invoked (dispatch target)\n- `?actor` - Who is performing the action (initially\
  \ always `@player`)\n\n## Verb Signature Consistency\n\nAll implementations of a\
  \ verb must have the same parameter signature:\n- `:give` \u2192 `(?item)`\n- `:put`\
  \ \u2192 `(?surface)` or `(?surface ?position)` with optional trailing\n- `:ask`\
  \ \u2192 `(?topic)`\n- `:unlock` \u2192 `(?key)`\n- `:examine` \u2192 `()`\n\n##\
  \ Introspection\n\nLLM adaptation layer needs to query available behaviors:\n\n\
  ```scheme\n(behaviors @hacker)\n; \u2192 ((:give (?item) \"Give something to the\
  \ hacker\")\n;    (:ask (?topic) \"Ask the hacker about something\"))\n```\n\n##\
  \ Error Handling\n\nIf target has no behavior for the verb, return error. LLM should\
  \ not call behaviors that don't exist (it introspects first).\n\n## Migration\n\n\
  Hard cutover - update all existing behaviors and (do) call sites."
