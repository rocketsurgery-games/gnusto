id: gnusto-6w5.7
title: Add quasiquote, unquote, unquote-splicing to Grue
type: task
priority: 2
created: '2026-01-17T10:04:28.350792-05:00'
updated: '2026-02-08T19:07:11.021475Z'
description: "Add Scheme-standard quasiquoting to enable dynamic effect list construction.\n\
  \n**Syntax:**\n- \\`(...) - quasiquote (like ' but allows unquoting inside)\n- ,expr\
  \ - unquote (evaluate and insert single value)  \n- ,@expr - unquote-splicing (evaluate\
  \ and merge list into parent)\n\n**Examples:**\n\\`((set x ,(compute-value)) (success))\n\
  \\`((clear-flag ?door OPENBIT) ,@(if cond '((queue evt)) '()) (success))\n\\`(,@(fn-returning-effects)\
  \ (success))\n\n**This single feature solves:**\n- Dynamic values in effect lists\
  \ (was: let bindings)\n- Conditional effects (was: if/when in effects)  \n- Function\
  \ calls returning effects (merge with ,@)\n- Custom mutations (pure fns returning\
  \ effects)\n\nCloses: frotzlm-6w5.8, frotzlm-6w5.9, frotzlm-6w5.10 (all subsumed\
  \ by this)"
