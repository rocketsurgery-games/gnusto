id: gnusto-b1f
title: GRUE Language Design & Coherence
type: task
priority: 2
created: '2026-01-11T11:49:04.80973-05:00'
updated: '2026-02-08T19:07:11.055299Z'
description: |-
  Epic for ensuring GRUE language semantics are coherent, well-documented, and support static analysis. Key areas:

  1. **Form vs Function distinction** - Clarify which constructs are special forms (custom evaluation) vs functions (uniform evaluation), important for static analysis
  2. **Binding model** - Unify self/`?actor`/`?with` conventions, document dynamic vs lexical scoping
  3. **Parser architecture** - Separate S-expr parsing from form interpretation for cleaner extensibility
  4. **REPL simplification** - Remove special-cased command handling, use same evaluation as runtime
  5. **Symbol naming conventions** - Decide on canonical casing, remove case-insensitive aliasing

  Design goals:
  - Support future static analysis (type checking, dead code detection, behavior validation)
  - Minimize special cases in interpreter
  - Clear, documented semantics following Lisp-family conventions
