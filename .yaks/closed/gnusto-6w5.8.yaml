id: gnusto-6w5.8
title: Support (if ...) conditionals in effect lists
type: task
priority: 2
created: '2026-01-17T10:04:28.520428-05:00'
updated: '2026-02-08T19:07:11.021166Z'
description: |-
  Allow conditional effects inside effect lists.

  **Problem:** Patterns like `(success :effects ((if condition (move! @x @y) nil)))` can't be migrated because the EffectInterpreter doesn't evaluate conditionals.

  **Options:**
  1. Evaluate `(if ...)` during effect interpretation (adds complexity)
  2. Require all conditionals to be in outer cond branches (verbose but pure)
  3. Support a `(when condition effect)` effect type in the interpreter

  **Affected:** elevator-door-closes, nitrogen-evaporates events
