description: |-
  Translate the HACKER's food-for-key trading puzzle.

  ## Scope
  The core puzzle: trade hot Chinese food for the master key.

  ### Behaviors to implement:
  - `:give` - give objects to hacker
  - `:trade` - propose trades
  - `:show` - show objects to hacker

  ### GIVE logic:
  - CHINESE-FOOD/CARTON with food inside:
    - Check RMUNGBIT (overcooked) -> throws away
    - Check HEAT >= 12 -> accepts, eats, offers key if HACKER-TRADE?
    - HEAT < 12 -> "cold!" or "not warm enough", rejects
  - SNACK (not munged) -> accepts, eats
  - COKE -> "I only drink Diet Coke"
  - Other -> "No thanks, keep it"

  ### TRADE logic:
  - CHINESE-FOOD for MASTER-KEY -> "Give me the food first" (sets HACKER-TRADE?)
  - Other trades -> "not a good trade"

  ### SHOW logic:
  - FOODBIT items -> "Winnage! I could do with some"
  - SMOOTH-STONE -> "Are you a rock-jock?"
  - HAND -> "Mondo grosso!"
  - DEAD-RAT -> "Get rid of it!"
  - Other -> grunts, little interest

  ### "GIVE ME" (asking hacker for things):
  - HELP-KEY -> redirects to HELP
  - KEYRING -> "can't give you my keys"
  - MASTER-KEY -> depends on CARTON given, may loan key
  - Other keys -> "boring old keys"
  - Other -> "I don't have that"

  ### State:
  - HACKER-TRADE? flag
  - HEAT property on CHINESE-FOOD
  - RMUNGBIT on food items
  - I-FOOD-HINT queue

