description: |-
  When extracting preconditions from behaviors, inject implicit visibility constraints for ?self and arguments. Runtime enforces visible? check on all player interactions (builtins.grue:82), so backward analysis should generate these as constraints.

  Visibility semantics (from runtime.py):
  - Object's containing room must match player's room
  - OR object is held by player
  - OR object is in open container at player's location
  - Scenery objects: in room's :visible list

  Implementation:
  - Modify _extract_preconditions() in backward.py
  - For each behavior target (?self), add visibility constraint
  - For behavior arguments, also add visibility constraints
  - Express as location constraints (player location = object's room)
