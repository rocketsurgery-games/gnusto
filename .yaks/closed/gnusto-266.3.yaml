description: "Implement automatic inference of minimal value domains from reduced\
  \ expressions.\n\n1. Write domain analysis:\n   - For each StatePath, collect all\
  \ values that can be written to it\n   - Scan effect lists for (move ...) and (set\
  \ ...) with literal values\n   - For variable writes, use conservative approximation\
  \ from builtin specs\n\n2. Read pattern analysis:\n   - For each StatePath, analyze\
  \ how it's used in comparisons\n   - (= (loc @obj) @player) \u2192 equality check\
  \ against @player\n   - (= (loc @obj) ?from) \u2192 equality check against runtime\
  \ param domain\n   - (:prop @obj) in boolean context \u2192 truthiness check\n\n\
  3. Minimal domain computation:\n   - If path only compared to @player, domain is\
  \ {held, not-held} (2 values)\n   - If compared to finite literal set, domain is\
  \ that set\n   - If compared to runtime param, intersect with param's domain spec\n\
  \   - Otherwise, full write domain\n\n4. ValueDomain and AbstractionConfig classes:\n\
  \   - ValueDomain tracks possible values and abstraction function\n   - AbstractionConfig\
  \ bundles tracked paths + their domains\n   - Derived automatically from analysis,\
  \ not manually specified\n\nDeliverables:\n- src/frotz/domains.py with ValueDomain,\
  \ DomainAnalyzer\n- Integration with effect analysis\n- Test on floor-waxer case:\
  \ should infer 5-value domain for loc(@floor-waxer)"
