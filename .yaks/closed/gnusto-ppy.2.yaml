  Translate the simple sensory and social behaviors for the HACKER NPC.

  ## Scope
  Basic interactions that don't involve complex state or puzzles.

  ### Behaviors to implement:
  - `:examine` - state-dependent description (normal vs at-your-terminal vs in-lair)
  - `:listen` - "humming something... perhaps Bach?"
  - `:smell` - "in need of cleaning"
  - `:hello` - "Greetingage." + turns back to hacking
  - `:thank` - blushes (if helped or has master key)

  ### State dependencies:
  - HACKER-HELP level (0, 1, 2, 3+)
  - LAIR-CNT > 6 (hacker in lair, different responses)
  - I-HACKER-HELPS queued (hacker at your terminal)

  ### Notes:
  - These are the simpler verbs - good starting point
  - Examine has the most complexity with multiple description branches
  - Can stub out state checks initially

