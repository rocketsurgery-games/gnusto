description: |-
  kitchen.grue has duplicated helper functions:

  - `format-timer` is defined identically inside both @microwave (line 28) and @controls (line 166)
  - `temp-names` is defined identically inside both @microwave (line 26) and @controls (line 164)

  These should be moved to top-level `def`/`defn` so they're shared:
  ```scheme
  (def temp-names '("off" "warm" "low" "medium" "high"))

  (defn format-timer ()
    (let ((mins (/ microwave-timer 60))
          (secs (mod microwave-timer 60)))
      (str mins ":" (if (< secs 10) "0" "") secs)))
  ```

  Also duplicated in @readout (line 194 redefines temp-names locally).
