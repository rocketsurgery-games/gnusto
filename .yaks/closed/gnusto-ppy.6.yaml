description: |-
  Translate the TERMINAL-ROOM-F room action routine.

  ## Scope
  Room-level event handling for the terminal room.

  ### Functionality:
  1. **HACKER-HELPS interference** (BEG phase):
     - When I-HACKER-HELPS queued and player tries RUB/POINT/CLICK/HELP on MENU-BOX/MORE-BOX
     - Hacker snarls "Who's the hacker here?"

  2. **COMPULSION override** (BEG phase):
     - When I-COMPULSION queued, most actions get overridden
     - Allowed: RUB/POINT/CLICK/PUSH/ATTACK on MORE-BOX, READ ODD-PAPER
     - Other actions: "Your throat tightens" / "body refuses to obey"
     - Forces: "finger moving towards the MORE box"

  3. **Nightmare wake-up** (ENTER phase):
     - When entering from PLATFORM-ROOM (nightmare sequence)
     - "awakened by the thump of your head"
     - Queues I-HACKER-HELPS

  ### Dependencies:
  - Requires event queue system (frotzlm-ppy.5)
  - Requires room action/hook mechanism in runtime

  ### Design questions:
  - How do room actions integrate with GRUE?
  - Options: room-level :behaviors, :on-enter/:on-action hooks, separate (room-action ...) forms

