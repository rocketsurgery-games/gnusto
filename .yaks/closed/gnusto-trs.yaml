id: gnusto-trs
title: Room :describe behaviors not used by look command
type: bug
priority: 2
created: '2026-01-14T21:26:12.030651-05:00'
updated: '2026-02-08T19:07:11.026296Z'
description: Rooms can have :describe behaviors for dynamic room descriptions (e.g.,
  @dead-storage in cs-basement.grue). However, get_room_description() in runtime.py
  only returns static ldesc, ignoring the dynamic behavior. The REPL look command
  should evaluate :describe if present.
