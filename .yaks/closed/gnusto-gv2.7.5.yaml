priority: 3
created: '2026-01-24T10:44:14.726163-05:00'
updated: '2026-02-08T19:07:11.067641Z'
description: "Implemented monotonic state pruning for exploration:\n\n**Key changes:**\n\
  1. Added `get_one_way_flags()` to EffectAnalysis - detects properties that only\
  \ change in one direction (e.g., rmung: False->True)\n2. Added `MonotonicPruner`\
  \ class in explorer.py - tracks seen states by non-monotonic fingerprint and prunes\
  \ dominated states\n3. Integrated pruning into StateExplorer - automatically enabled\
  \ when effects analysis is provided\n4. Added `states_pruned_monotonic` stat to\
  \ ExplorationStats\n\n**How it works:**\n- One-way flags are identified by static\
  \ analysis (properties with single target value \u2260 initial value)\n- States\
  \ are split into monotonic and non-monotonic parts\n- A state is pruned if we've\
  \ already seen a state with the same non-monotonic values but 'better' monotonic\
  \ values (closer to final)\n- Example: {player@kitchen, rmung=False} is dominated\
  \ by {player@kitchen, rmung=True}\n\n**Results for LH:**\n- 36 one-way flags detected\n\
  - Moderate state savings in exploration (varies by tracked refs)\n- Enabled automatically\
  \ when effects are passed to explore_state_space()\n\nThis implements domination-based\
  \ pruning for irreversible state transitions."
