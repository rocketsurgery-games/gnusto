id: gnusto-d4ui.7
title: Room transitions and visual polish
type: task
priority: 3
created: '2026-02-24T12:00:00Z'
updated: '2026-02-24T12:00:00Z'
description: |
  Make room changes feel like transitions, not just content swaps. Polish the overall
  visual experience.

  ## Scope

  1. **Room transition system** — When a RoomEnter block arrives, animate the changeover.
     Options to explore: fade/dissolve, slide in direction of travel, room image crossfade,
     brief darkness ("you walk through the corridor..."). The architecture from d4ui.1
     should make this straightforward — room changes are already discrete events.

  2. **Hero image transitions** — The room header image could animate: crossfade between
     old and new room, or Ken Burns-style pan within an image. Atmospheric.

  3. **Block entrance animations** — Content blocks fade/slide in as they arrive (the
     current CSS does this simply; make it smoother with framework transitions).

  4. **Ambient effects** — Subtle environmental touches: different color palettes per
     room area (dungeon = darker, outdoors = lighter), screen edge effects (fog, glow),
     cursor changes. Purely atmospheric, driven by room metadata.

  5. **Typography refinement** — Fine-tune the type system for the structured layout.
     Room headers, sidebar text, narrative prose, dialogue — each may need different
     treatment in the new layout.

  6. **Sound design hooks** — Placeholder for ambient audio, sound effects. Not
     implementing audio yet, but the transition system should have hooks for triggering
     audio events alongside visual transitions.

  ## Design direction

  The goal is "polished indie game" not "web application." Think Disco Elysium's UI
  crossed with a classic text adventure. Rich, atmospheric, but text-first.
