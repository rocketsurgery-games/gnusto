id: gnusto-b2e7
title: :ask-about needs to reference @objects
type: bug
priority: 1
created: '2026-02-21T00:01:55Z'
updated: '2026-02-21T00:01:55Z'
description: |
  For example, if you :ask-about "the hacker's keys", it will pass the string straight through. But this behavior expects an @object reference, not an arbitrary string.
  
  We should investigate the set of patterns more fully, to see if we need to do something to generalize this mechanism (so the agent knows to look up an object before passing an arbitrary string to a behavior). Or whether we need some kind of annotation to tell the agent what types are allowable in behavior args.
