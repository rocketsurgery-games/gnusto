description: |-
  When testing the microwave puzzle interactively, discovered that there's no default `put` behavior for putting items into containers.

  ## Observed behavior:
  ```
  rt.do('@carton', 'put', '@microwave')
  # Returns: outcome=blocked, reason=no-behavior
  ```

  ## Expected behavior:
  Should have a default behavior that allows putting items into containers, similar to how we have default `take`, `open`, `close`, etc.

  ## Implementation notes:
  - Need to add `(default put ...)` in builtins.grue
  - Should check that target has CONTBIT
  - Should check that target is open (has OPENBIT) or is always-open
  - Should move the item to the container

  ## Workaround:
  Tests currently use `(move! @item @container)` in setup to bypass this.
