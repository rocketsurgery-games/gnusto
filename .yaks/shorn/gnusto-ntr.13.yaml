id: gnusto-ntr.13
title: Unbound symbols should error, not return string
type: task
priority: 1
created: '2026-01-14T10:02:23.120062-05:00'
updated: '2026-02-08T19:07:10.968335Z'
labels:
- lang
description: "Undefined symbols silently become strings instead of raising errors.\n\
  \n**Current code (expr.py lines 361-366):**\n```python\ntry:\n    return self.state.get_global(expr.name)\n\
  except (KeyError, AttributeError):\n    # Return as string literal (object name,\
  \ flag name, etc.)\n    return expr.name\n```\n\n**Problem:** This masks bugs. For\
  \ example, `empty?` and `cons` were returning their names as strings for a long\
  \ time because they weren't implemented. Code appeared to work but produced wrong\
  \ results.\n\n**Lisp norm:** Unbound symbols should raise an error. Exceptions:\n\
  - Self-quoting forms: keywords (Clojure), nil/t (Common Lisp)\n- Intentionally undefined\
  \ (should be explicit, not fallback)\n\n**Solution:**\n1. Raise `UnboundVariableError`\
  \ for unknown symbols\n2. If we need literal strings for object names (@player),\
  \ use explicit syntax:\n   - Keep @ prefix for object references\n   - Or use symbols\
  \ explicitly: `'player` \n   - Or use strings: `\"player\"`\n\n**Migration concern:**\
  \ Existing code relies on this behavior for:\n- Object names (@player \u2192 \"\
  @player\")\n- Flag names (TAKEBIT \u2192 \"TAKEBIT\")\n- Maybe other cases\n\nNeed\
  \ to audit usage patterns and decide on explicit syntax.\n\nThis is critical for\
  \ language soundness - errors should be loud, not silent."
