description: |-
  Move these simple predicates from Python to Grue:

  - held? = (defn held? (?obj) (= (loc ?obj) (player)))
  - here? = (defn here? (?obj) (= (loc ?obj) (loc (player))))
  - in? = (defn in? (?obj ?container) (= (loc ?obj) ?container))
  - held-by? = (defn held-by? (?obj ?holder) (= (loc ?obj) ?holder))
  - at? = (defn at? (?obj ?other) (= (loc ?obj) (loc ?other)))
  - loc? = (defn loc? (?obj ?expected) (= (loc ?obj) ?expected))

  Steps:
  1. Add definitions to builtins.grue
  2. Remove Python implementations from expr.py
  3. Run tests to verify behavior unchanged
