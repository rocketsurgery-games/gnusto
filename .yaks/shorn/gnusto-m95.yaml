id: gnusto-m95
title: Merge ObjectState flags into properties
type: task
priority: 2
created: '2026-01-17T23:59:20.747253-05:00'
updated: '2026-02-08T19:07:11.011464Z'
depends_on:
- gnusto-q1n
description: |-
  Change ObjectState dataclass to store flags as boolean properties instead of a separate set.

  - Remove `flags: set[str]` field from ObjectState
  - During initialization, convert flags to boolean properties
  - Update get_object_flags() to derive from properties for backward compat
  - Update set_flag()/clear_flag() to use property setters

  This is the core data model change that enables everything else.
