description: "While implementing for/doseq, I noticed we don't have a range function.\
  \ This would be useful for elevator iteration:\n\n```scheme\n(for (?floor (range\
  \ 4)) ...)         ; iterate 0-3\n(for (?floor (range 1 4)) ...)       ; iterate\
  \ 1-3\n```\n\nClojure-style range:\n- (range n) \u2192 (0 1 ... n-1)\n- (range start\
  \ end) \u2192 (start start+1 ... end-1)\n- (range start end step) \u2192 (start\
  \ start+step ...)\n\nThis is a language feature, not a LH task."
