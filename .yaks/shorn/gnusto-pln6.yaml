id: gnusto-pln6
title: Unified LLM narration and object resolution
type: bug
priority: 2
created: '2026-01-25T19:02:30.25583-05:00'
updated: '2026-02-08T14:08:45.043121-05:00'
description: "## Problem\n\nThe current agent flow has two issues:\n\n1. **Input**:\
  \ LLM can't resolve natural language object references (e.g., \"ask hacker about\
  \ his keyring\" \u2192 `@keyring`)\n2. **Output**: Raw Grue responses are streamed\
  \ directly (e.g., `@hacker: \"This is a master key.\" revealed master key`) rather\
  \ than being narrated by the LLM\n\n## Design: Unified LLM Narration\n\n### Current\
  \ Flow\n```\nUser input \u2192 LLM decides action(s) \u2192 Tool calls \u2192 Raw\
  \ results streamed \u2192 Final LLM summary\n```\n\n### Proposed Flow\n```\nUser\
  \ input \u2192 LLM decides action \u2192 Tool call \u2192 LLM narrates result \u2192\
  \ (repeat or stop) \u2192 Done\n```\n\n### Key Changes\n\n**1. Per-step narration**\
  \ (not just final summary)\n- After each tool result, LLM produces a narrative fragment\n\
  - Preserve authored dialogue verbatim, frame exposition thoughtfully\n- Results\
  \ accumulate in history for context\n\n**2. Early stopping**\n- LLM can choose to\
  \ stop a planned sequence if something unexpected happens\n- Return control to player\
  \ with \"what would you like to do?\" framing\n\n**3. Better object resolution**\
  \ (original issue)\n- Include object ID\u2194description mapping prominently in\
  \ context\n- LLM can reference objects naturally in its narration\n\n**4. Image\
  \ awareness**\n- Pass available images with metadata (what they depict, when relevant)\n\
  - LLM can request image display as part of narration\n- Simple filter structure\
  \ for state-dependent image selection\n\n### Implementation Chunks\n\n1. Refactor\
  \ tool result handling - Stop streaming raw results, accumulate for LLM\n2. Per-step\
  \ narration prompt - Ask LLM to narrate each result, with quote-preservation guidance\n\
  3. Early stopping mechanism - Let LLM signal \"stop sequence, need player input\"\
  \n4. Image catalog - Simple structure listing available images with descriptions\n\
  5. Image selection in narration - LLM can include image references in output"
