description: |
  - Move from flat LLM prose to 'graphic novel' style rendering with distinct visual streams for narration, dialogue, thought, atmosphere, and discovery.

  ## Goals
  - Define a concrete content block vocabulary (the agent's output language)
  - Build a standalone layout renderer (HTML/CSS/JS) for block sequences
  - Experiment with image composition via filfre, decoupled from :render specs
  - Iterate on layout + composition across diverse scenarios
  - Bring the vocabulary and layout algorithm back into the real system

  ## Block types
  narrate, speak (speaker/manner), think, ambient, reveal (entity), scene (transition)

  ## Experiment
  #experiments/layout/standalone HTML/CSS/JS renderer with 5 Lurking Horror scenarios
