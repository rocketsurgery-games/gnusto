id: gnusto-0l8
title: Design standard binding for give/trade item in NPC behaviors
type: task
priority: 3
created: '2026-01-11T19:17:23.612536-05:00'
updated: '2026-02-08T19:07:11.075765Z'
description: "The hacker behaviors in terminal-room.grue use ?object to refer to the\
  \ item being given/traded, but this is not a standard binding.\n\nCurrent situation:\n\
  - Behaviors are on @hacker, so ?self = @hacker  \n- Behaviors check (= ?object @carton)\
  \ etc for the item\n- But ?object is not defined in the standard binding model\n\
  \nThe problem is that for \"give X to Y\":\n- Direct object (behavior target): Y\
  \ (@hacker)\n- Indirect object (item): X (@carton)\n- We need a standard binding\
  \ for X\n\nOptions:\n1. Add ?item binding for give/put/show/trade verbs\n2. Use\
  \ ?with (\"give carton with hacker\" is weird though)\n3. Move behaviors to item\
  \ objects with special dispatch\n4. Use ?indirect as standard name\n\nThis blocks\
  \ proper testing of the give/trade puzzle in terminal-room.test.grue.\n\nSee also:\
  \ docs/grue.md binding documentation"
