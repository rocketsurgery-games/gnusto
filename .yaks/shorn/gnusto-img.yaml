description: 'Create a runtime that executes GRUE behaviors against game state. Takes
  a GrueWorld and provides: (1) State management for objects/rooms, (2) Action dispatch
  to object behaviors, (3) Behavior case evaluation using the expression evaluator,
  (4) Effect execution to update state. This enables manual testing of GRUE world
  definitions.'
