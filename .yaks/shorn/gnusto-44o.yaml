description: |-
  Rename the project from frotz-lm to Gnusto (the write-magic-spell from Enchanter).

  The naming scheme:
  - **Gnusto** - The IF authoring system (outer project)
  - **Grue** - The language for defining IF worlds (lives in the dark passages of code)
  - **Frotz** - The state-space analyzer (the light spell that illuminates winnability)

  This epic covers:
  1. Renaming the project and repository
  2. Implementing the Frotz static analyzer

  See docs/frotz-design.md for the Frotz design document.
