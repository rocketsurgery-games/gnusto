id: gnusto-ntr.1
title: Support nested defn inside object for scoped helpers
type: task
priority: 2
created: '2026-01-12T21:27:40.271832-05:00'
updated: '2026-02-08T19:07:11.035015Z'
labels:
- lang
description: "Allow `defn` and `def` forms inside `(object ...)`, `(room ...)`, etc.\
  \ to define scoped helpers and values, with a general mechanism for nested forms.\n\
  \n## Motivation\n\nCurrently, shared code/data used across behaviors requires globals:\n\
  ```lisp\n(defn hacker-foo () (success :context ((description \"w00t\"))))\n(def\
  \ terminal-dark-desc \"The room is pitch black...\")\n\n(object @hacker\n  :behaviors\
  \ (\n    :foo (fn () (hacker-foo))))\n```\n\nProblems:\n- Pollutes global namespace\
  \ with many small functions/values\n- Naming conventions (hacker-foo, terminal-dark-desc)\
  \ become unwieldy at scale\n- No clear ownership/scoping\n- Can't write `:foo hacker-foo`\
  \ directly (parser expects `(fn ...)` form)\n\n## Proposed Syntax\n\n### 1. Object-scoped\
  \ def/defn\n\n```lisp\n(object @hacker\n  (def greeting \"Hello, world!\")\n  (defn\
  \ helper () \n    (success :context ((description greeting))))\n  \n  :behaviors\
  \ (\n    :foo (fn () (helper))\n    :bar (fn () (helper))))\n```\n\n```lisp\n(room\
  \ @terminal-room\n  (def dark-desc \"The room is pitch black...\")\n  (def lit-desc\
  \ \"Fluorescent lights illuminate...\")\n  \n  :description dark-desc\n  :behaviors\
  \ (\n    :look (fn ()\n      (if (has-flag? ?self LIT)\n        (success :context\
  \ ((description lit-desc)))\n        (success :context ((description dark-desc)))))))\n\
  ```\n\n### 2. Symbol references in behavior position\n\n```lisp\n(defn shared-examine\
  \ ()\n  (success :context ((description \"You see nothing special.\"))))\n\n(object\
  \ @rock\n  :behaviors (\n    :examine shared-examine))  ; reference, not (fn ()\
  \ (shared-examine))\n\n(object @hacker\n  (defn hacker-examine () ...)\n  \n  :behaviors\
  \ (\n    :examine hacker-examine))  ; works with scoped fns too\n```\n\n## Semantics\n\
  \n- `def`/`defn` inside entity creates bindings visible only within that entity's\
  \ scope\n- Available to all behaviors, events, property expressions, and other scoped\
  \ forms\n- NOT visible outside the entity (no export mechanism needed)\n- Can reference\
  \ `?self` implicitly in `defn` bodies (it's the containing entity)\n- Symbol in\
  \ behavior position is resolved: first in entity scope, then global scope\n- Scoped\
  \ `def` values are static (evaluated once at parse/load time)\n- Scoped `defn` functions\
  \ are evaluated at call time with current bindings\n\n## Implementation: General\
  \ Nested Form Handling\n\nRather than special-casing `def` and `defn`, implement\
  \ a general mechanism:\n\n### Parser Side\n\n```python\n# In form parsing (object,\
  \ room, etc.)\ndef parse_entity(form):\n    name = ...\n    nested_forms = []\n\
  \    kwargs = {}\n    \n    for item in form[2:]:  # after entity type and name\n\
  \        if is_list(item) and is_symbol(item[0]):\n            # It's a nested form\
  \ like (def ...) or (defn ...)\n            nested_forms.append(item)\n        elif\
  \ is_keyword(item):\n            # It's a property like :description\n         \
  \   kwargs[item] = next_item\n    \n    return Entity(name, nested_forms=nested_forms,\
  \ **kwargs)\n```\n\n### Entity Dataclass\n\n```python\n@dataclass\nclass GrueObject:\n\
  \    name: str\n    nested_forms: list[SExpr] = field(default_factory=list)  # raw\
  \ (def), (defn), etc.\n    # ... other fields\n```\n\n### Evaluator Side\n\n```python\n\
  def build_entity_scope(entity: GrueObject) -> dict[str, Any]:\n    \"\"\"Process\
  \ nested forms into a scope dict.\"\"\"\n    scope = {}\n    for form in entity.nested_forms:\n\
  \        form_type = form[0].name\n        if form_type == \"def\":\n          \
  \  name, value = parse_def(form)\n            scope[name] = evaluate(value)  # static\
  \ evaluation\n        elif form_type == \"defn\":\n            name, params, body\
  \ = parse_defn(form)\n            scope[name] = Function(params, body)  # deferred\
  \ evaluation\n        # Future forms automatically work if they follow (form-name\
  \ ...) pattern\n    return scope\n```\n\n### Benefits of General Approach\n\n1.\
  \ Adding new nested forms (e.g., `defmacro`, `defconst`, `deftest`) requires no\
  \ parser changes\n2. Entity dataclasses stay simple - just store raw forms\n3. Form-specific\
  \ logic lives in evaluator where it belongs\n4. Consistent pattern across all entity\
  \ types (object, room, npc, etc.)\n\n## Symbol Resolution Order\n\nWhen evaluating\
  \ expressions within an entity:\n1. Local bindings (`?self`, behavior params, `let`\
  \ bindings)\n2. Entity-scoped bindings (from nested `def`/`defn`)\n3. Global bindings\
  \ (top-level `def`/`defn`)\n4. Built-in functions\n\n## Open Questions\n\n- Should\
  \ scoped bindings be visible to contained objects? (probably no)\n- Should `def`\
  \ values be lazily evaluated? (probably no - keep it simple)\n- Allow `def` to reference\
  \ other `def`s in same entity? (yes, in order)"
