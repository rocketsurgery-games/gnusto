updated: '2026-02-08T19:07:11.059006Z'
description: "The runtime's _try_default_behavior(), do(), _do_go(), and _evaluate_behavior()\
  \ methods contain logic that could be expressed in Grue code instead of Python.\n\
  \n## Current State\n- Default take/drop behaviors are hardcoded in Python\n- Movement\
  \ logic is in Python  \n- Actor parameter now generalized (no longer hardcoded to\
  \ PLAYER)\n\n## Proposed Approach\nDefine default behaviors in a defaults.grue file\
  \ that gets loaded with every world:\n\n```lisp\n(behavior take\n  (case (not (has-flag\
  \ self TAKEBIT))\n    :outcome blocked :reason not-takeable)\n  (case (and (not\
  \ (here? self)) (not (held? self)))\n    :outcome blocked :reason not-here)\n  (case\
  \ (held? self)\n    :outcome blocked :reason already-held)\n  (case true\n    :outcome\
  \ success\n    :effects ((move! self ?actor))))\n```\n\n## Benefits\n- Default behaviors\
  \ become data, not code\n- Easier to override/extend per-game\n- Same execution\
  \ path for all behaviors\n- Validates that Grue is expressive enough for core logic"
