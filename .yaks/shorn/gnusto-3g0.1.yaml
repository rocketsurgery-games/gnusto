id: gnusto-3g0.1
title: Filter self-referential preconditions in decomposer
type: task
priority: 2
created: '2026-01-24T18:24:04.842196-05:00'
updated: '2026-02-08T19:07:10.995965Z'
description: |-
  When a behavior sets property X=V, and also reads X, don't add X=V as a precondition. The read is likely a guard checking the OPPOSITE condition.

  Example: @high-voltage:cut reads :rmung to block if already cut, but sets :rmung=True. Current code adds rmung=True as precondition, creating circular dependency.

  Quick fix: In _preconditions_for(), filter out goals that match what the behavior achieves.
