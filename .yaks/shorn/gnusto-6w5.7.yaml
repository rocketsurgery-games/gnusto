id: gnusto-6w5.7
title: Add quasiquote, unquote, unquote-splicing to Grue
type: task
priority: 2
created: '2026-01-17T10:04:28.350792-05:00'
updated: '2026-02-08T19:07:11.021475Z'
description: |-
  Add Scheme-standard quasiquoting to enable dynamic effect list construction.

  **Syntax:**
  - \`(...) - quasiquote (like ' but allows unquoting inside)
  - ,expr - unquote (evaluate and insert single value)
  - ,@expr - unquote-splicing (evaluate and merge list into parent)

  **Examples:**
  \`((set x ,(compute-value)) (success))
  \`((clear-flag ?door OPENBIT) ,@(if cond '((queue evt)) '()) (success))
  \`(,@(fn-returning-effects) (success))

  **This single feature solves:**
  - Dynamic values in effect lists (was: let bindings)
  - Conditional effects (was: if/when in effects)
  - Function calls returning effects (merge with ,@)
  - Custom mutations (pure fns returning effects)

  Closes: frotzlm-6w5.8, frotzlm-6w5.9, frotzlm-6w5.10 (all subsumed by this)
