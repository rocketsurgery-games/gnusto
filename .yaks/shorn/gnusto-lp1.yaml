description: 'Systematically test OmniGen2''s ability to: (1) reliably compose scenes
  with multiple objects in specified spatial relationships, (2) use reference images
  to maintain consistency of characters, objects, and style across generations. This
  will determine if we need additional tools like GLIGEN/ControlNet or if OmniGen2
  alone is sufficient.'
