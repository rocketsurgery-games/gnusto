id: gnusto-gv2.4
title: Black hole detection via constraints
type: task
priority: 2
created: '2026-01-21T00:06:52.378238-05:00'
updated: '2026-02-08T19:07:11.002905Z'
description: |-
  Detect black holes: states from which victory is unreachable.

  A black hole occurs when ALL alternative paths to victory are blocked:
  - key_held blocked (key permanently lost) AND lockpick_not_broken false (lockpick used)

  Detection approach:
  1. Identify irreversible state changes (key in abyss, lockpick broken, player dead)
  2. Check if irreversible changes block ALL paths in constraint hierarchy OR-structure
  3. Mark such states as black holes during exploration

  This integrates with gv2.9 (guided exploration) - black hole detection enables pruning paths that can't reach victory.

  Perfection not required - missing obscure deep black holes is acceptable.
