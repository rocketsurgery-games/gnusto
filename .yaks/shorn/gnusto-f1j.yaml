id: gnusto-f1j
title: Generalize :via to support (through) behaviors on arbitrary objects
type: bug
priority: 1
created: '2026-01-10T11:02:22.794361-05:00'
updated: '2026-02-08T19:07:10.97702Z'
description: "## Problem\nConverter emits `:per ROUTINE` on exits but this doesn't\
  \ map well to a declarative model. PER routines handle many different patterns:\n\
  - Object barriers (manhole cover blocking exit)\n- NPC interactions (hacker preventing\
  \ theft)\n- Inventory checks (too bulky to squeeze through)\n- Progress gates (need\
  \ to clear junk pile)\n- Complex state machines (elevator)\n\n## Solution\nGeneralize\
  \ `:via` to work with any object that has a `(through)` behavior:\n\n1. **Parser**:\
  \ Remove `:per` field from GrueExit. Keep `:via` pointing to object names.\n\n2.\
  \ **Runtime**: When moving through an exit with `:via OBJECT`:\n   - Find the object\n\
  \   - If it has a `(through)` behavior, evaluate it\n   - Allow movement only if\
  \ behavior succeeds\n\n3. **Converter**: Transform PER routines into objects:\n\
  \   - Simple object gates \u2192 `:via THAT-OBJECT` (e.g., MANHOLE-COVER)\n   -\
  \ NPC gates \u2192 `:via NPC-NAME` with (through) behavior\n   - Complex cases \u2192\
  \ synthesize `{ROOM}-{DIR}-PASSAGE` barrier object\n   - Attach ZIL routine source\
  \ as comment for translation agent\n\n## Examples\n\n### NPC blocking (HACKER-EXIT)\n\
  ```lisp\n(room TERMINAL-ROOM\n  :exits ((south :to CS-2ND :via HACKER)))\n\n(object\
  \ HACKER\n  :behaviors (\n    (through (direction)\n      :when (not (or (player-has\
  \ PC) (player-has CHAIR)))\n      :otherwise \"You can't walk off with that!\")))\n\
  ```\n\n### Inventory check (TOMB-SQUEEZE)\n```lisp\n(room TOMB\n  :exits ((northwest\
  \ :to SUB-BASEMENT :via TOMB-PASSAGE)))\n\n(object TOMB-PASSAGE\n  :location TOMB\n\
  \  :flags (INVISIBLE)\n  :behaviors (\n    (through (direction)\n      :when (not\
  \ (player-carrying-heavy-item))\n      :otherwise \"It's too tight a fit.\")))\n\
  ```\n\n### Progress gate (STORAGE-EXIT)\n```lisp\n(object JUNK-PILE\n  :properties\
  \ (:moved-count 0 :moves-needed 5)\n  :behaviors (\n    (through (direction)\n \
  \     :when (> (self :moved-count) (self :moves-needed))\n      :otherwise \"The\
  \ junk blocks your way.\")))\n```\n\n## Acceptance Criteria\n- [ ] Parser handles\
  \ `:via OBJECT` on exits (already works)\n- [ ] Runtime evaluates `(through)` behavior\
  \ on via objects before allowing movement\n- [ ] Converter transforms PER routines\
  \ into `:via` with appropriate objects\n- [ ] Synthesized barrier objects include\
  \ ZIL source as comments\n- [ ] REPL shows blocking messages from (through) behaviors"
