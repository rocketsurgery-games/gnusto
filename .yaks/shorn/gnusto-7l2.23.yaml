id: gnusto-7l2.23
title: Use for/doseq in elevator button logic
type: task
priority: 2
created: '2026-01-14T14:11:04.31284-05:00'
updated: '2026-02-08T19:07:11.030448Z'
labels:
- lh
description: |-
  elevator.grue has several places where we iterate over floors 0-3 manually. We can use `for` now.

  **elevator-called? (line 83-88):**
  ```scheme
  ; Current ugly manual iteration
  (defn elevator-called? ()
    (or (and (any-button-pressed? 0) (not (= elevator-loc 0)))
        (and (any-button-pressed? 1) (not (= elevator-loc 1)))
        (and (any-button-pressed? 2) (not (= elevator-loc 2)))
        (and (any-button-pressed? 3) (not (= elevator-loc 3)))))

  ; Could be (need `any` or `some` function):
  (defn elevator-called? ()
    (any (fn (?f) (and (any-button-pressed? ?f) (not (= elevator-loc ?f))))
         '(0 1 2 3)))
  ```

  **@floor-button :examine (lines 243-253):**
  Building glowing list by chaining cons - could use `for` with `keep`:
  ```scheme
  ; Current
  (let ((?g0 '())
        (?g1 (if (go-button-pressed? 0) (cons "B" ?g0) ?g0))
        ...

  ; Could be
  (let ((?glowing (keep (fn (?f) (if (go-button-pressed? ?f)
                                    (nth '("B" "1" "2" "3") ?f)
                                    nil))
                        '(0 1 2 3))))
  ```

  **elevator-moves event (lines 488-492):**
  Checking all doors manually - could iterate:
  ```scheme
  ; Current
  ((or (has-flag @elevator-door OPENBIT)
       (has-flag @elevator-door-b OPENBIT)
       ...

  ; Could define a list of doors and use `any`
  (def all-elevator-doors '(@elevator-door @elevator-door-b @elevator-door-1 @elevator-door-2 @elevator-door-3))
  (any (fn (?d) (has-flag ?d OPENBIT)) all-elevator-doors)
  ```

  Requires: `any` and `some` functions for predicates (we have `any` for collections but not as higher-order predicate test).
