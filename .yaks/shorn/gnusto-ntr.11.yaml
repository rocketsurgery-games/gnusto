description: "CRITICAL: The current implementation uses textual substitution for variable\
  \ binding in `let` and `fn`. This breaks fundamental Lisp semantics.\n\n**Current\
  \ approach:**\n```python\n# In _eval_let:\nvalue = self.eval(binding[1])\nresult_expr\
  \ = self._substitute(result_expr, name, value)\nreturn self.eval(result_expr)\n\
  ```\n\n**Problems:**\n1. Values substituted directly into code cause data/code confusion\n\
  2. SList values become forms to evaluate (had to hack _substitute to convert SList\u2192\
  list)\n3. No proper lexical scope - closures don't capture environments correctly\n\
  4. Performance issues (re-parsing/transforming expressions)\n5. Can't distinguish\
  \ quoted data from code after substitution\n\n**Solution:** Implement an Environment\
  \ class:\n```python\n@dataclass\nclass Environment:\n    bindings: dict[str, Any]\n\
  \    parent: Optional[\"Environment\"] = None\n\n    def lookup(self, name: str)\
  \ -> Any:\n        if name in self.bindings:\n            return self.bindings[name]\n\
  \        if self.parent:\n            return self.parent.lookup(name)\n        raise\
  \ UnboundVariableError(name)\n```\n\nThen evaluator carries current environment\
  \ and extends it for let/fn:\n```python\ndef eval(self, expr: SExpr, env: Environment)\
  \ -> Any:\n    if isinstance(expr, Symbol):\n        return env.lookup(expr.name)\n\
  \    # ...\n\ndef _eval_let(self, form: SList, env: Environment) -> Any:\n    new_env\
  \ = Environment({}, parent=env)\n    for binding in bindings:\n        new_env.bindings[name]\
  \ = self.eval(value_expr, env)  # or new_env for let*\n    return self.eval(body,\
  \ new_env)\n```\n\nThis is a significant refactor but essential for a sound language\
  \ implementation."
