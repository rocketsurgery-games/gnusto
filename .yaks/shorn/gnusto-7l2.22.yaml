description: "## Problem\n\nThe PC login flow is missing from our conversion. After\
  \ turning on the PC, the menu box appears immediately, but the original game requires:\n\
  \n1. `type 872325412` (login ID) \u2192 responds \"PASSWORD PLEASE:\"\n2. `type\
  \ uhlersoth` (password) \u2192 shows menu box with \"Edit Classics Paper\"\n\nAlternative\
  \ shortcuts: `xyzzy`/`plugh` also work as login/password.\n\n## Root Cause\n\nThis\
  \ mechanic is implemented as a **verb-level state machine**, not as object behaviors:\n\
  \n1. **Global state variables**: `USERNAME?` and `LOGGED-IN?` track login progress\n\
  2. **V-TYPE verb**: Intercepts typing and redirects to `V-LOGIN` or `V-PASSWORD`\
  \ based on state\n3. **V-LOGIN**: Sets `USERNAME?` when valid login entered\n4.\
  \ **V-PASSWORD**: Sets `LOGGED-IN?` and moves `MENU-BOX` to `PC` when valid password\
  \ entered\n5. **CANT-USE-COMPUTER?**: Checks PC is accessible and powered on\n\n\
  The original ZIL code is in:\n- `games/lurkinghorror/source/pc.zil` lines 291-347\
  \ (V-LOGIN, V-PASSWORD routines)\n- `games/lurkinghorror/source/parser.zil` lines\
  \ 437-463 (LOGIN-ID, PASSWORD-STRING constants)\n\nThe reference conversion captured\
  \ this in `converted/reference/routines.grue` but it was never implemented because\
  \ our conversion focused on object behaviors, not verb-level mechanics.\n\n## Additional\
  \ Issues Found During Playtesting\n\n### 1. Menu-box starting location\n- **Original**:\
  \ Menu-box starts in nil/limbo; only moves to PC after successful login\n- **Ours**:\
  \ Menu-box starts in @pc, visible immediately after power-on\n- **Fix**: Change\
  \ `@menu-box :location` from `@pc` to `nil`\n\n### 2. PC examine output after login\n\
  - **Original**: \"On the screen you see a mouse.\" (shows first item in PC container)\n\
  - **Ours**: Doesn't dynamically show screen contents in examine output\n- **ZIL**:\
  \ `(<FIRST? ,PC> <TELL \" On the screen you see \" A <FIRST? ,PC> \".\">`\n\n###\
  \ 3. Screen element \"take\" messages\n- **Original**: \"You won't get a passing\
  \ grade for that idea!\" (for take menu-box)\n- **Ours**: Likely gives generic \"\
  can't take\" message\n- **ZIL**: Custom TRYTAKEBIT handling in object behaviors\n\
  \n### 4. Login state reset\n- **Original**: Turning off PC or unplugging it resets\
  \ USERNAME? and LOGGED-IN? via INIT-PC routine\n- **Ours**: No login state to reset,\
  \ but when implemented need to wire up state clearing\n\n## Lessons for Future Conversions\n\
  \n1. **Verbs can have state machines**: Some mechanics live in verb handlers (V-TYPE,\
  \ V-LOGIN, V-PASSWORD), not object behaviors. These are easy to miss.\n\n2. **Look\
  \ for NEW-VERB redirects**: When a verb routine calls `<NEW-VERB ...>`, it's redirecting\
  \ to another verb based on state. This pattern indicates a multi-step interaction\
  \ flow.\n\n3. **Check SYNTAX definitions**: The syntax file shows custom verbs like\
  \ `LOGIN OBJECT` and `PASSWORD OBJECT` that hint at special mechanics.\n\n4. **Global\
  \ variables as state**: `USERNAME?` and `LOGGED-IN?` are global flags that persist\
  \ across turns. Object properties are per-object; globals track cross-object state.\n\
  \n5. **Test against the original**: Running `dfrotz` on the compiled game reveals\
  \ interaction flows that aren't obvious from reading ZIL source alone.\n\n6. **Watch\
  \ for INIT-* routines**: These often reset state when objects change state (power\
  \ off, close, etc.).\n\n## Fix Approach\n\nOption A: Add `:login` and `:password`\
  \ behaviors to PC object with globals tracking state\nOption B: Implement as a barrier/interceptor\
  \ on PC read/click behaviors\nOption C: Create a \"login-flow\" event that tracks\
  \ state\n\nRecommend Option A as it maps most directly to the original ZIL structure.\n\
  \nSpecific fixes needed:\n1. Add `logged-in` and `username` globals to pc.grue\n\
  2. Move @menu-box starting location to nil\n3. Add `:type` behavior that redirects\
  \ to login/password flow based on state\n4. Update `:turn-off` and `:unplug` to\
  \ reset login state\n5. Update `:examine` to show \"On the screen you see...\" for\
  \ first item in PC\n6. Add custom TRYTAKEBIT messages for screen elements"
