id: gnusto-ntr.20
title: 'Strict property initialization: no declaration without init, no read/write
  without declaration'
type: task
priority: 2
created: '2026-01-22T16:17:30.49431-05:00'
updated: '2026-02-08T19:07:11.000334Z'
description: |-
  Enforce stricter property handling to improve static analysis and catch bugs:

  1. No declaration without initialization - all properties in :properties must have values
  2. No read without declaration - (:prop @obj) errors if :prop not in @obj's :properties
  3. No write without declaration - (set @obj :prop val) errors if :prop not declared

  This eliminates the nil/false ambiguity discovered during backward analysis, where unset properties return nil but game logic treats nil as falsy (same as false).

  Benefits:
  - Initial state is fully explicit and analyzable
  - Catches property name typos at parse/load time
  - Documents object schemas implicitly
  - Simplifies static analysis (no need to handle undefined properties)

  Implementation:
  - Parser/loader validates property declarations
  - Runtime checks read/write against declared properties
  - Could be warning-only initially, then enforced
