id: gnusto-gv2.9
title: Lazy/guided state exploration
type: task
priority: 2
created: '2026-01-21T15:28:40.115978-05:00'
updated: '2026-02-08T19:07:11.000909Z'
description: |-
  Replace exhaustive BFS with constraint-guided exploration. Goals:

  1. **Winnability**: Find victory path quickly by prioritizing constraint-progress
  2. **Black hole detection**: Identify states where all paths to victory are blocked
  3. **Smart termination**: Stop exploring when diminishing returns, not just depth

  Key strategies:
  - Priority queue by constraint distance (existing metric from gv2.1)
  - Prune paths with permanently unsatisfiable constraints
  - Cluster saturation: stop exploring clusters with no new outgoing transitions
  - Terminate early once victory reachability is proven

  Black holes can be imperfect - obscure deep paths that lead to black holes are acceptable to miss.

  This is foundational for scaling to real games with 1000s of states.
