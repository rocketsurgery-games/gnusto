[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gnusto"
version = "0.1.0"
description = "Gnusto: LLM-powered interactive fiction system using the Grue language"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0",
    "torchvision",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "diffusers>=0.32.0",
    "sentencepiece",
    "protobuf",
    "pillow",
    "anthropic>=0.75.0",
    "pyyaml>=6.0.3",
    "litellm>=1.81.0",
    "rich>=14.2.0",
    "textual>=7.3.0",
    "textual-image[textual]>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "ipython",
]

[project.scripts]
gnusto = "gnusto.__main__:main"
grue-repl = "grue.repl:main"
grue-test = "grue.test:main"
zilch = "grue.converter:cli_main"
frotz = "frotz.cli:main"
filfre = "filfre.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
