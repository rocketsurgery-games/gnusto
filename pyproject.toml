[project]
name = "frotzlm"
version = "0.1.0"
description = "Text adventure illustration using OmniGen2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0",
    "torchvision",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "diffusers>=0.32.0",
    "sentencepiece",
    "protobuf",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "ipython",
]
