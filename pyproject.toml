[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gnusto"
version = "0.1.0"
description = "Gnusto: LLM-powered interactive fiction system using the Grue language"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0",
    "torchvision",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "diffusers>=0.32.0",
    "sentencepiece",
    "protobuf",
    "pillow",
    "anthropic>=0.75.0",
    "pyyaml>=6.0.3",
    "litellm>=1.81.0",
    "rich>=14.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # OmniGen2 dependencies (vendor/omnigen2)
    "einops",
    "timm",
    "opencv-python-headless",
    "scipy",
    "omegaconf",
]

[project.optional-dependencies]
dev = [
    "ipython",
]

[project.scripts]
gnusto = "gnusto.__main__:main"
grue-repl = "grue.repl:main"
grue-test = "grue.test:main"
zilch = "grue.converter:cli_main"
frotz = "frotz.cli:main"
filfre = "filfre.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# Ensure uv resolves dependencies for both platforms
[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
# Use CUDA wheels on Linux, standard PyPI wheels on macOS (with MPS support)
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
diffusers = { git = "https://github.com/huggingface/diffusers.git" }

[tool.pytest.ini_options]
pythonpath = ["src"]
