[project]
name = "frotz-lm"
version = "0.1.0"
description = "Text adventure illustration using OmniGen2"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0",
    "torchvision",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "diffusers>=0.32.0",
    "sentencepiece",
    "protobuf",
    "pillow",
    "anthropic>=0.75.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "ipython",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.setuptools.packages.find]
include = ["zil*"]

[tool.pytest.ini_options]
pythonpath = ["."]
