[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frotz-lm"
version = "0.1.0"
description = "Runtime and language for LM-aided text adventures"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0",
    "torchvision",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "diffusers>=0.32.0",
    "sentencepiece",
    "protobuf",
    "pillow",
    "anthropic>=0.75.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "ipython",
]

[project.scripts]
grue-repl = "grue.repl:main"
grue-test = "grue.test:main"
zil-to-grue = "grue.converter:cli_main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
