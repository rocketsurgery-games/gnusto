# Lurking Horror - Terminal Room Area
# Converted from ZIL source to World DSL format

meta:
  name: "The Lurking Horror - Terminal Room"
  author: "Infocom (Dave Lebling)"
  description: "Starting area of The Lurking Horror"
  starting_room: TERMINAL-ROOM

globals:
  score: 0
  moves: 0

rooms:
  TERMINAL-ROOM:
    description: "Terminal Room"
    long_description: |
      This is a large room crammed with computer terminals, small
      computers, and printers. An exit leads south. Banners, posters, and
      signs festoon the walls. Most of the tables are covered with waste
      paper, old pizza boxes, and empty Coke cans. There are usually a lot of
      people here, but tonight it's almost deserted.
    exits:
      south: CS-2ND
      out: CS-2ND
    flags:
      - ONBIT

  CS-2ND:
    description: "Second Floor"
    long_description: |
      This is the second floor of the Computer Center. A large, noisy room
      is to the north.
    exits:
      north: TERMINAL-ROOM
      west: KITCHEN
    flags:
      - ONBIT

  KITCHEN:
    description: "Kitchen"
    long_description: |
      This is a filthy kitchen. The exit is to the east. On the wall near a
      counter are a refrigerator and a microwave.
    exits:
      east: CS-2ND
    flags:
      - RLANDBIT
      - ONBIT

objects:
  HACKER:
    description: "hacker"
    initial_location: TERMINAL-ROOM
    synonyms:
      - HACKER
      - YOURSELF
    flags:
      - SEARCHBIT
      - PERSON
      - OPENBIT
      - CONTBIT
    properties:
      blocking: true

  CHAIR:
    description: "chair"
    long_description: "Nearby is one of those ugly molded plastic chairs."
    initial_location: TERMINAL-ROOM
    synonyms:
      - CHAIR
    adjectives:
      - MOLDED
      - PLASTIC
      - UGLY
    flags:
      - TAKEBIT
      - VEHBIT
      - SEARCHBIT
      - CONTBIT
      - OPENBIT
      - FURNITURE
      - SURFACEBIT
    properties:
      size: 100

  PC:
    description: "pc"
    long_description: "A really whiz-bang pc is right inside the door."
    initial_location: TERMINAL-ROOM
    synonyms:
      - PC
      - COMPUTER
      - SCREEN
      - TERMINAL
    adjectives:
      - PERSONAL
      - MY
      - MONITOR
    flags:
      - TAKEBIT
      - TRYTAKEBIT
      - OPENBIT
      - CONTBIT
      - SEARCHBIT
      - SURFACEBIT
    properties:
      size: 30

# Actions for objects in this area
actions:
  TAKE:
    syntax:
      - "take [object]"
      - "get [object]"
      - "pick up [object]"
    preconditions:
      - "(has-flag ?obj TAKEBIT)"
      - "(visible? ?obj)"
      - "(not (held? ?obj))"
    effects:
      - "(move! ?obj PLAYER)"
    messages:
      success: "Taken."
      failure: "You can't take that."

  EXAMINE:
    syntax:
      - "examine [object]"
      - "look at [object]"
      - "x [object]"
    preconditions:
      - "(visible? ?obj)"
    messages:
      success: ""

# Transitions triggered by specific conditions
transitions:
  hacker-blocks-exit:
    trigger:
      action: GO
      direction: south
    when: "(or (held? PC) (held? CHAIR))"
    message: |
      The hacker prevents you. "You can't walk off with that!
      It's Tech property!"

# Game invariants
invariants:
  player-has-light:
    check: |
      (or
        (has-flag (loc PLAYER) ONBIT)
        (any (inventory PLAYER)
             (lambda (obj)
               (and (has-flag obj LIGHTBIT)
                    (has-flag obj ONBIT)))))
    on_violation: "It is pitch dark. You are likely to be eaten by a grue."
